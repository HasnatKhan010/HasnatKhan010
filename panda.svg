<svg width="1280" height="150" viewBox="0 0 1280 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* ===== Timeline: 20s loop =====
         0%-30%   walk right
         30%-45%  dance in place
         45%-75%  walk back left
         75%-90%  dance in place
         90%-100% idle rest
      */
      #panda-walker {
        animation: moveX 20s ease-in-out infinite;
      }
      @keyframes moveX {
        0%   { transform: translateX(0px); }
        30%  { transform: translateX(900px); }
        45%  { transform: translateX(900px); }
        75%  { transform: translateX(0px); }
        90%  { transform: translateX(0px); }
        100% { transform: translateX(0px); }
      }

      #panda-body {
        animation: body 20s ease-in-out infinite;
        transform-origin: 70px 95px;
      }
      @keyframes body {
        0%    { transform: translateY(0px) rotate(0deg); }
        7.5%  { transform: translateY(-5px) rotate(0deg); }
        15%   { transform: translateY(0px) rotate(0deg); }
        22.5% { transform: translateY(-5px) rotate(0deg); }
        30%   { transform: translateY(0px) rotate(0deg); }
        32%   { transform: translateY(-12px) rotate(-6deg); }
        34%   { transform: translateY(0px) rotate(6deg); }
        36%   { transform: translateY(-12px) rotate(-6deg); }
        38%   { transform: translateY(0px) rotate(6deg); }
        40%   { transform: translateY(-12px) rotate(-6deg); }
        42%   { transform: translateY(0px) rotate(6deg); }
        45%   { transform: translateY(0px) rotate(0deg); }
        52.5% { transform: translateY(-5px) rotate(0deg); }
        60%   { transform: translateY(0px) rotate(0deg); }
        67.5% { transform: translateY(-5px) rotate(0deg); }
        75%   { transform: translateY(0px) rotate(0deg); }
        77%   { transform: translateY(-12px) rotate(6deg); }
        79%   { transform: translateY(0px) rotate(-6deg); }
        81%   { transform: translateY(-12px) rotate(6deg); }
        83%   { transform: translateY(0px) rotate(-6deg); }
        85%   { transform: translateY(-12px) rotate(6deg); }
        87%   { transform: translateY(0px) rotate(-6deg); }
        90%   { transform: translateY(0px) rotate(0deg); }
        100%  { transform: translateY(0px) rotate(0deg); }
      }

      #leg-left  { animation: legL 20s ease-in-out infinite; transform-origin: 55px 108px; }
      #leg-right { animation: legR 20s ease-in-out infinite; transform-origin: 85px 108px; }
      @keyframes legL {
        0%    { transform: rotate(16deg); }
        7.5%  { transform: rotate(-16deg); }
        15%   { transform: rotate(16deg); }
        22.5% { transform: rotate(-16deg); }
        30%   { transform: rotate(0deg); }
        32%   { transform: rotate(-8deg); }
        34%   { transform: rotate(8deg); }
        36%   { transform: rotate(-8deg); }
        38%   { transform: rotate(8deg); }
        40%   { transform: rotate(-8deg); }
        42%   { transform: rotate(8deg); }
        45%   { transform: rotate(0deg); }
        52.5% { transform: rotate(16deg); }
        60%   { transform: rotate(-16deg); }
        67.5% { transform: rotate(16deg); }
        75%   { transform: rotate(0deg); }
        77%   { transform: rotate(-8deg); }
        79%   { transform: rotate(8deg); }
        81%   { transform: rotate(-8deg); }
        83%   { transform: rotate(8deg); }
        85%   { transform: rotate(-8deg); }
        87%   { transform: rotate(8deg); }
        90%   { transform: rotate(0deg); }
        100%  { transform: rotate(0deg); }
      }
      @keyframes legR {
        0%    { transform: rotate(-16deg); }
        7.5%  { transform: rotate(16deg); }
        15%   { transform: rotate(-16deg); }
        22.5% { transform: rotate(16deg); }
        30%   { transform: rotate(0deg); }
        32%   { transform: rotate(8deg); }
        34%   { transform: rotate(-8deg); }
        36%   { transform: rotate(8deg); }
        38%   { transform: rotate(-8deg); }
        40%   { transform: rotate(8deg); }
        42%   { transform: rotate(-8deg); }
        45%   { transform: rotate(0deg); }
        52.5% { transform: rotate(-16deg); }
        60%   { transform: rotate(16deg); }
        67.5% { transform: rotate(-16deg); }
        75%   { transform: rotate(0deg); }
        77%   { transform: rotate(8deg); }
        79%   { transform: rotate(-8deg); }
        81%   { transform: rotate(8deg); }
        83%   { transform: rotate(-8deg); }
        85%   { transform: rotate(8deg); }
        87%   { transform: rotate(-8deg); }
        90%   { transform: rotate(0deg); }
        100%  { transform: rotate(0deg); }
      }

      #arm-left  { animation: armL 20s ease-in-out infinite; transform-origin: 42px 78px; }
      #arm-right { animation: armR 20s ease-in-out infinite; transform-origin: 98px 78px; }
      @keyframes armL {
        0%    { transform: rotate(-14deg); }
        7.5%  { transform: rotate(14deg); }
        15%   { transform: rotate(-14deg); }
        22.5% { transform: rotate(14deg); }
        30%   { transform: rotate(0deg); }
        32%   { transform: rotate(-70deg); }
        34%   { transform: rotate(-50deg); }
        36%   { transform: rotate(-70deg); }
        38%   { transform: rotate(-50deg); }
        40%   { transform: rotate(-70deg); }
        42%   { transform: rotate(-50deg); }
        45%   { transform: rotate(0deg); }
        52.5% { transform: rotate(-14deg); }
        60%   { transform: rotate(14deg); }
        67.5% { transform: rotate(-14deg); }
        75%   { transform: rotate(0deg); }
        77%   { transform: rotate(-70deg); }
        79%   { transform: rotate(-50deg); }
        81%   { transform: rotate(-70deg); }
        83%   { transform: rotate(-50deg); }
        85%   { transform: rotate(-70deg); }
        87%   { transform: rotate(-50deg); }
        90%   { transform: rotate(0deg); }
        100%  { transform: rotate(0deg); }
      }
      @keyframes armR {
        0%    { transform: rotate(14deg); }
        7.5%  { transform: rotate(-14deg); }
        15%   { transform: rotate(14deg); }
        22.5% { transform: rotate(-14deg); }
        30%   { transform: rotate(0deg); }
        32%   { transform: rotate(70deg); }
        34%   { transform: rotate(50deg); }
        36%   { transform: rotate(70deg); }
        38%   { transform: rotate(50deg); }
        40%   { transform: rotate(70deg); }
        42%   { transform: rotate(50deg); }
        45%   { transform: rotate(0deg); }
        52.5% { transform: rotate(14deg); }
        60%   { transform: rotate(-14deg); }
        67.5% { transform: rotate(14deg); }
        75%   { transform: rotate(0deg); }
        77%   { transform: rotate(70deg); }
        79%   { transform: rotate(50deg); }
        81%   { transform: rotate(70deg); }
        83%   { transform: rotate(50deg); }
        85%   { transform: rotate(70deg); }
        87%   { transform: rotate(50deg); }
        90%   { transform: rotate(0deg); }
        100%  { transform: rotate(0deg); }
      }

      #eyes { animation: blink 4.5s ease-in-out infinite; transform-origin: 70px 55px; }
      @keyframes blink {
        0%, 90%, 100% { transform: scaleY(1); }
        94% { transform: scaleY(0.15); }
      }
    </style>
  </defs>

  <g id="panda-walker">
    <g id="panda-body">
      <!-- legs -->
      <g id="leg-left">
        <ellipse cx="55" cy="108" rx="13" ry="20" fill="#232323"/>
        <ellipse cx="55" cy="122" rx="9" ry="5" fill="#3a3a3a"/>
      </g>
      <g id="leg-right">
        <ellipse cx="85" cy="108" rx="13" ry="20" fill="#232323"/>
        <ellipse cx="85" cy="122" rx="9" ry="5" fill="#3a3a3a"/>
      </g>

      <!-- body -->
      <ellipse cx="70" cy="82" rx="32" ry="35" fill="#ffffff" stroke="#232323" stroke-width="2.5"/>
      <ellipse cx="70" cy="88" rx="15" ry="17" fill="#fbfbfb"/>

      <!-- arms -->
      <g id="arm-left">
        <ellipse cx="42" cy="78" rx="10" ry="19" fill="#232323"/>
      </g>
      <g id="arm-right">
        <ellipse cx="98" cy="78" rx="10" ry="19" fill="#232323"/>
      </g>

      <!-- head -->
      <circle cx="70" cy="46" r="29" fill="#ffffff" stroke="#232323" stroke-width="2.5"/>

      <!-- ears -->
      <circle cx="48" cy="20" r="11" fill="#232323"/>
      <circle cx="92" cy="20" r="11" fill="#232323"/>
      <circle cx="48" cy="20" r="4.5" fill="#4a4a4a"/>
      <circle cx="92" cy="20" r="4.5" fill="#4a4a4a"/>

      <!-- eye patches -->
      <ellipse cx="55" cy="49" rx="10" ry="12" fill="#232323"/>
      <ellipse cx="85" cy="49" rx="10" ry="12" fill="#232323"/>

      <!-- eyes with sparkle -->
      <g id="eyes">
        <circle cx="56" cy="50" r="4" fill="#ffffff"/>
        <circle cx="84" cy="50" r="4" fill="#ffffff"/>
        <circle cx="57.3" cy="48.5" r="1.3" fill="#232323"/>
        <circle cx="85.3" cy="48.5" r="1.3" fill="#232323"/>
      </g>

      <!-- nose + mouth -->
      <ellipse cx="70" cy="58" rx="3.6" ry="2.6" fill="#232323"/>
      <path d="M 70 60 Q 70 67 63 68" stroke="#232323" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M 70 60 Q 70 67 77 68" stroke="#232323" stroke-width="1.8" fill="none" stroke-linecap="round"/>

      <!-- blush -->
      <circle cx="46" cy="56" r="4" fill="#ffb3c1" opacity="0.55"/>
      <circle cx="94" cy="56" r="4" fill="#ffb3c1" opacity="0.55"/>
    </g>
  </g>
</svg>
